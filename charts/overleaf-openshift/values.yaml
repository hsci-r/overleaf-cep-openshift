# Alternatively build images/overleaf and publish to your own registry.
image:
  repository: docker.io/hsci/overleaf-cep-openshift
  tag: latest
  pullPolicy: Always
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

route:
  enabled: true
  # Set a hostname served by your OpenShift ingress. Required when route.enabled=true.
  host: ""
  annotations:
    haproxy.router.openshift.io/timeout: 15m
    haproxy.router.openshift.io/hsts_header: max-age=31536000
  # Optional PEM material for a custom domain; these are stored in the Route.
  tls:
    certificate: ""
    key: ""
    caCertificate: ""

# Required if the Route is disabled. This deployment expects an HTTPS proxy.
siteUrl: ""
appName: "Overleaf CE+"
adminEmail: ""
# Helm generates and retains a Secret unless a name is supplied.
secrets:
  existingSecret: ""
# Optional SMTP credentials or additional environment variables from a Secret.
extraEnvFrom: []
# Scalar environment variables. Do not override chart-managed connection settings.
extraEnv:
  ENABLE_CONVERSIONS: "true"
  EMAIL_CONFIRMATION_DISABLED: "true"
  # Keep externally linked files opt-in; configure these with upstream names.
  ENABLED_LINKED_FILE_TYPES: project_file,project_output_file

persistence:
  # Empty uses the cluster default StorageClass; set a name to override it.
  storageClass: ""
  size: 20Gi
  existingClaim: ""
  # Preserve chart-managed PVCs when uninstalling.
  retain: true
resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: "2"
    memory: 4Gi
# No runAsUser, runAsGroup, fsGroup, or supplementalGroups: SCC assigns them.
nodeSelector:
  kubernetes.io/arch: amd64
tolerations: []
affinity: {}
terminationGracePeriodSeconds: 240
startupProbe:
  failureThreshold: 120
  periodSeconds: 10

mongodb:
  image: mongo:8.0
  persistence:
    storageClass: ""
    size: 10Gi
    existingClaim: ""
    retain: true
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  # Keep WiredTiger below the memory limit, leaving room for connections/overhead.
  wiredTigerCacheSizeGB: "0.5"
redis:
  image: redis:7.4
  persistence:
    storageClass: ""
    size: 2Gi
    existingClaim: ""
    retain: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

compilation:
  # Explicit opt-in: requires the compiler namespace and the new runner images.
  backend: local # local or kubernetes; never an automatic fallback.
  timeoutSeconds: 180 # CE+ retains upstream's 600-second maximum.
  requestSizeMB: 7
  defaultCompiler: pdflatex
  kubernetes:
    namespace: "" # A dedicated, otherwise empty namespace; create before install.
    image: docker.io/hsci/overleaf-cep-openshift:latest-compiler
    requestTimeoutSeconds: 840
    idleSeconds: 600
    maxLifetimeSeconds: 21600
    finishedTtlSeconds: 60
    workspaceSize: 1Gi # Private pod storage; rsync needs room for old/new versions of a changed file.
    temporarySize: 512Mi
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
        ephemeral-storage: 256Mi
      limits:
        cpu: "1.5"
        memory: 8Gi
        ephemeral-storage: 2Gi
    nodeSelector:
      kubernetes.io/arch: amd64
    imagePullSecrets: [] # Existing Secrets in the compiler namespace.
uploads:
  maxSizeMB: 50 # Also configures the internal nginx body-size limit.
  timeoutSeconds: 120
nginx:
  proxyTimeoutSeconds: 900 # Must exceed the compile timeout.
  keepaliveTimeoutSeconds: 65
  workerConnections: 2048
  workerProcesses: 1
# Runs alongside Overleaf; both use loopback API/history addresses.
gitBridge:
  enabled: true
  # Match the CE release underlying the application image.
  image: quay.io/sharelatex/git-bridge:6.3.0
  persistence:
    storageClass: ""
    size: 10Gi
    existingClaim: ""
    retain: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  # Upstream Git bridge settings, e.g. GIT_BRIDGE_JVM_ARGS.
  extraEnv: {}
