# Alternatively build images/overleaf and publish to your own registry.
image:
  repository: docker.io/hsci/overleaf-cep-openshift
  tag: "6.3.0-ext-v5.1-openshift.1"
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

route:
  enabled: true
  # Set a hostname served by your OpenShift ingress. Required when route.enabled=true.
  host: ""
  annotations:
    haproxy.router.openshift.io/timeout: 15m
    haproxy.router.openshift.io/hsts_header: max-age=31536000
  # Optional PEM material for a custom domain; these are stored in the Route.
  tls:
    certificate: ""
    key: ""
    caCertificate: ""

# Required if the Route is disabled. This deployment expects an HTTPS proxy.
siteUrl: ""
appName: "Overleaf CE+"
adminEmail: ""
# Generated by scripts/create-secret.py. Never regenerate on upgrade.
secrets:
  existingSecret: overleaf-secrets
# Optional SMTP credentials or additional environment variables from a Secret.
extraEnvFrom: []
# Scalar environment variables. Do not override chart-managed connection settings.
extraEnv: {}

persistence:
  # Empty uses the cluster default StorageClass; set a name to override it.
  storageClass: ""
  size: 20Gi
  existingClaim: ""
  # Preserve chart-managed PVCs when uninstalling.
  retain: true
resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: "2"
    memory: 4Gi
# No runAsUser, runAsGroup, fsGroup, or supplementalGroups: SCC assigns them.
nodeSelector:
  kubernetes.io/arch: amd64
tolerations: []
affinity: {}
terminationGracePeriodSeconds: 240
startupProbe:
  failureThreshold: 120
  periodSeconds: 10

mongodb:
  image: mongo:8.0
  persistence:
    storageClass: ""
    size: 10Gi
    existingClaim: ""
    retain: true
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  # Keep WiredTiger below the memory limit, leaving room for connections/overhead.
  wiredTigerCacheSizeGB: "0.5"
redis:
  image: redis:7.4
  persistence:
    storageClass: ""
    size: 2Gi
    existingClaim: ""
    retain: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# CE+ sends an activation email; users choose a password through that link.
registration:
  enabled: false
  # Exact domains or *.subdomain patterns. Empty permits every domain.
  allowedEmailDomains: []
compilation:
  timeoutSeconds: 180 # CE+ retains upstream's 600-second maximum.
  requestSizeMB: 7
  defaultCompiler: pdflatex
uploads:
  maxSizeMB: 50 # Also configures the internal nginx body-size limit.
  timeoutSeconds: 120
nginx:
  proxyTimeoutSeconds: 900 # Must exceed the compile timeout.
  keepaliveTimeoutSeconds: 65
  workerConnections: 2048
  workerProcesses: 1
features:
  historyRestore: false # Experimental; existing projects may need an opt-in.
  pandocConversions: false # Experimental; pandoc is included in our image.
  chat: true
  linkedFilesFromUrl: false
sharing:
  publicAccess: false
  anonymousReadWrite: false
  linkSharing: true
  restrictInvitesToExistingAccounts: false
templateGallery:
  enabled: false
  nonAdminCanPublish: false
  managerUserId: ""
  categories: [academic-journal, book, presentation, poster, cv, homework, bibliography, calendar, formal-letter, report, thesis, newsletter]
  # Optional labels/descriptions keyed by a category above, or all.
  labels: {}
retention:
  automaticDeletion: false
  deletedUsersDays: 90
  deletedProjectsDays: 90
smtp:
  host: ""
  port: 587
  secure: false
  verifyCertificate: true
  ignoreStartTLS: false
  sender: ""
  replyTo: ""
  name: ""
  # Keys OVERLEAF_EMAIL_SMTP_USER / OVERLEAF_EMAIL_SMTP_PASS, if needed.
  existingSecret: ""
authentication:
  # CE+ supports simultaneous methods; empty keeps local accounts only.
  methods: [] # ldap, saml, oidc
  existingSecret: "" # Provider credentials, using upstream environment keys.
  # Provider configuration in upstream OVERLEAF_LDAP_*, OVERLEAF_SAML_* or
  # OVERLEAF_OIDC_* variables. Put passwords/private keys in existingSecret.
  settings: {}
integrations:
  existingSecret: "" # OAuth secrets and optional TOKEN_CIPHER_PASSWORD.
  githubSync:
    enabled: false
    clientId: ""
  zotero:
    enabled: false
    clientKey: ""
