{{- $root := . -}}
{{- range $component, $port := dict "overleaf" 8088 "mongodb" 27017 "redis" 6379 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "overleaf.fullname" $root }}{{ if ne $component "overleaf" }}-{{ if eq $component "mongodb" }}mongo-headless{{ else }}redis{{ end }}{{ end }}
  labels:
    {{- include "overleaf.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  {{- if eq $component "mongodb" }}
  clusterIP: None
  publishNotReadyAddresses: true
  {{- end }}
  selector:
    {{- include "overleaf.selector" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  ports:
    - name: {{ if eq $component "overleaf" }}http{{ else }}tcp{{ end }}
      port: {{ $port }}
      targetPort: {{ $port }}
{{- end }}
