{{- $root := . -}}
{{- $claims := dict "overleaf" .Values.persistence "mongodb" .Values.mongodb.persistence "redis" .Values.redis.persistence }}
{{- if .Values.gitBridge.enabled }}
{{- $_ := set $claims "gitBridge" .Values.gitBridge.persistence }}
{{- end }}
{{- range $component, $p := $claims }}
{{- if not $p.existingClaim }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "overleaf.fullname" $root }}-{{ $component | kebabcase }}
  labels:
    {{- include "overleaf.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component | kebabcase }}
  {{- if $p.retain }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if $p.storageClass }}
  storageClassName: {{ $p.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $p.size }}
{{- end }}
{{- end }}
