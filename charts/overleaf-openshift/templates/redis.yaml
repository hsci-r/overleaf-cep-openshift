apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "overleaf.fullname" . }}-redis
  labels:
    {{- include "overleaf.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "overleaf.selector" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "overleaf.selector" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          securityContext:
            {{- include "overleaf.securityContext" . | nindent 12 }}
          # Bypass the image's root/chown entrypoint. AOF holds pending edits.
          command: [redis-server]
          args: [--bind, "0.0.0.0", --port, "6379", --dir, /data, --appendonly, "yes", --appendfsync, everysec, --save, "", --maxmemory-policy, noeviction, --protected-mode, "no"]
          ports:
            - name: redis
              containerPort: 6379
          startupProbe:
            exec:
              command: [sh, -ec, 'test "$(redis-cli ping)" = PONG']
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            exec:
              command: [sh, -ec, 'test "$(redis-cli ping)" = PONG']
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [sh, -ec, 'test "$(redis-cli ping)" = PONG']
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "overleaf.claim" (dict "root" . "component" "redis") }}
