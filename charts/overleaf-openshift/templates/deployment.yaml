apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "overleaf.fullname" . }}
  labels:
    {{- include "overleaf.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "overleaf.selector" . | nindent 6 }}
      app.kubernetes.io/component: overleaf
  template:
    metadata:
      labels:
        {{- include "overleaf.selector" . | nindent 8 }}
        app.kubernetes.io/component: overleaf
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: {{ eq .Values.compilation.backend "kubernetes" }}
      {{- if eq .Values.compilation.backend "kubernetes" }}
      serviceAccountName: {{ include "overleaf.fullname" . }}-runner
      {{- end }}
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: overleaf
          image: {{ printf "%s:%s" (required "Set image.repository to your built images/overleaf image" .Values.image.repository) .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "overleaf.securityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8088
          envFrom:
            - configMapRef:
                name: {{ include "overleaf.fullname" . }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- $root := . }}
            {{- range list "OVERLEAF_INVITE_TOKEN_SECRET" "WEB_API_PASSWORD" "STAGING_PASSWORD" "V1_HISTORY_PASSWORD" "CRYPTO_RANDOM" "OT_JWT_AUTH_KEY" }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-secrets" (include "overleaf.fullname" $root)) $root.Values.secrets.existingSecret }}
                  key: {{ . }}
            {{- end }}
            {{- range $name, $value := .Values.extraEnv }}
            - name: {{ $name }}
              value: {{ $value | toString | quote }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /status
              port: http
            timeoutSeconds: 5
            {{- toYaml .Values.startupProbe | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          # Runit restarts individual services; this detects a lost web endpoint.
          livenessProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/overleaf
      {{- if .Values.gitBridge.enabled }}
        - name: git-bridge
          image: {{ .Values.gitBridge.image | quote }}
          securityContext:
            {{- include "overleaf.securityContext" . | nindent 12 }}
          # Bypass upstream's root/chown wrapper; /conf is writable emptyDir.
          command: [/start.sh]
          env:
            {{- $bridge := dict
              "GIT_BRIDGE_API_BASE_URL" "http://127.0.0.1:3000/api/v0/"
              "GIT_BRIDGE_OAUTH2_SERVER" "http://127.0.0.1:4000"
              "GIT_BRIDGE_POSTBACK_BASE_URL" "http://127.0.0.1:8000"
              "GIT_BRIDGE_ROOT_DIR" "/data/git-bridge"
              "GIT_BRIDGE_REPOSTORE_MAX_FILE_SIZE" (mul .Values.uploads.maxSizeMB 1048576 | toString)
            }}
            {{- range $name, $value := mergeOverwrite $bridge .Values.gitBridge.extraEnv }}
            - name: {{ $name }}
              value: {{ $value | toString | quote }}
            {{- end }}
          ports:
            - name: git-bridge
              containerPort: 8000
          startupProbe:
            tcpSocket:
              port: git-bridge
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: git-bridge
          resources:
            {{- toYaml .Values.gitBridge.resources | nindent 12 }}
          volumeMounts:
            - name: git-bridge-data
              mountPath: /data/git-bridge
            - name: git-bridge-config
              mountPath: /conf
      {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-overleaf" (include "overleaf.fullname" .)) .Values.persistence.existingClaim }}
      {{- if .Values.gitBridge.enabled }}
        - name: git-bridge-data
          persistentVolumeClaim:
            claimName: {{ include "overleaf.claim" (dict "root" . "component" "gitBridge") }}
        - name: git-bridge-config
          emptyDir: {}
      {{- end }}
