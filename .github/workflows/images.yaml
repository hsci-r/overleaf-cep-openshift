name: Publish images
on:
  schedule:
    - cron: '0 3 * * 1'
  push:
    tags: [image-*]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (empty uses IMAGE_TAG from Makefile)
        required: false
        type: string
permissions:
  contents: read
jobs:
  check:
    uses: ./.github/workflows/check.yaml
  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [default, full, compiler]
    concurrency:
      group: images-${{ github.ref }}-${{ matrix.variant }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Select image
        id: image
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          IMAGE_REPOSITORY: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          tag="$REQUESTED_TAG"
          if [ "$GITHUB_EVENT_NAME" = push ]; then tag="${GITHUB_REF_NAME#image-}"; fi
          if [ -z "$tag" ]; then tag="$(awk '$1 == "IMAGE_TAG" {print $3; exit}' Makefile)"; fi
          [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,120}$ ]] || exit 1
          repository="$IMAGE_REPOSITORY"
          if [ -z "$repository" ]; then repository="$(awk '$1 == "IMAGE_REPOSITORY" {print $3; exit}' Makefile)"; fi
          if [ '${{ matrix.variant }}' = full ]; then
            tag="$tag-full"
            echo 'build_args=TEXLIVE_PACKAGES=scheme-full' >> "$GITHUB_OUTPUT"
          fi
          dockerfile=images/overleaf/Dockerfile
          if [ '${{ matrix.variant }}' = compiler ]; then
            tag="$tag-compiler"
            dockerfile=images/overleaf/compiler.Dockerfile
          else
            echo "base=$(python3 scripts/upstream-image.py)" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$repository:$tag" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$dockerfile" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: images/overleaf
          file: ${{ steps.image.outputs.dockerfile }}
          platforms: linux/amd64
          push: true
          pull: true
          tags: ${{ steps.image.outputs.tag }}
          build-args: |
            OVERLEAF_BASE_IMAGE=${{ steps.image.outputs.base }}
            ${{ steps.image.outputs.build_args }}
          cache-from: type=gha,scope=ceplus-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=ceplus-${{ matrix.variant }}
